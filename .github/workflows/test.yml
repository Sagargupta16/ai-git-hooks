name: Test Hooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Discovered, not listed, so adding a hook cannot silently skip the lint.
      - name: Lint hook scripts
        run: |
          scripts_found=$(find hooks scripts -type f -name '*.sh' | sort)
          echo "Linting:"
          echo "${scripts_found}"
          echo "${scripts_found}" | xargs shellcheck -x

  test-hooks:
    name: Test Hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          if command -v apt-get &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          elif command -v brew &>/dev/null; then
            brew install jq
          fi

      # No chmod here on purpose. The scripts are committed with mode 100755,
      # and this step is what proves a fresh clone can execute them. Adding a
      # chmod back would hide a broken shipped file mode from CI.
      # Discovered, not listed, so a new hook is covered without editing this.
      - name: Verify shipped scripts are executable
        run: |
          count=0
          for f in $(find hooks scripts -type f -name '*.sh' | sort); do
            test -x "$f" || { echo "Not executable in a fresh clone: $f"; exit 1; }
            count=$((count + 1))
          done
          test "${count}" -gt 0 || { echo "Found no shell scripts to check"; exit 1; }
          echo "All ${count} shell scripts are executable as checked out"

      - name: Run tests (dry-run mode)
        env:
          AI_HOOKS_DRY_RUN: "1"
        run: ./scripts/test.sh

  test-install:
    name: Test Installation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create test git repo
        run: |
          mkdir /tmp/test-project
          cd /tmp/test-project
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"

      # Invoked directly, with no chmod first, so this exercises the file mode
      # a user actually gets from `git clone`.
      - name: Run install script
        run: |
          cd /tmp/test-project
          "${{ github.workspace }}/scripts/install.sh" "${{ github.workspace }}"

      - name: Verify hooks installed
        run: |
          test -f /tmp/test-project/.git/hooks/pre-commit
          test -f /tmp/test-project/.git/hooks/prepare-commit-msg
          test -f /tmp/test-project/.git/hooks/commit-msg
          test -f /tmp/test-project/.git/hooks/pre-push
          test -x /tmp/test-project/.git/hooks/pre-commit
          echo "All hooks installed and executable"

      - name: Run uninstall script
        run: |
          cd /tmp/test-project
          "${{ github.workspace }}/scripts/uninstall.sh"

      - name: Verify hooks removed
        run: |
          ! test -f /tmp/test-project/.git/hooks/pre-commit
          ! test -f /tmp/test-project/.git/hooks/prepare-commit-msg
          ! test -f /tmp/test-project/.git/hooks/commit-msg
          ! test -f /tmp/test-project/.git/hooks/pre-push
          echo "All hooks removed successfully"
